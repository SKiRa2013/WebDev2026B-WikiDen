services:
  db:
    image: postgres:16-alpine
    container_name: wikiden_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-wikihub}
      POSTGRES_USER: ${DB_USER:-wikihub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wikihub_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wikihub_user} -d ${DB_NAME:-wikihub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    container_name: wikiden_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  